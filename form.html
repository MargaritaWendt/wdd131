<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Rewiew</title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals Form page, Gilda Margarita Ortiz Reategui, Form Page.">
    <meta name="author" content="Gilda Margarita Ortiz Reategui">
    <link rel="stylesheet" href="styles/form.css">
    <script src = "scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Rewiew</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">
            <fieldset>
                <label>Product Name <span aria-hidden="true" style="color:red;">*</span>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select></label>
        
                <div>Overall Rating <span aria-hidden="true" style="color:red;">*</span></div>
                <div class="stairs">
                <label><input type="radio" id="rating1" name="rating" value="1" required>☆</label>
                
                <label><input type="radio" id="rating2" name="rating" value="2">☆☆</label>
                
                <label><input type="radio" id="rating3" name="rating" value="3">☆☆☆</label>
                
                <label><input type="radio" id="rating4" name="rating" value="4">☆☆☆☆</label>
                
                <label><input type="radio" id="rating5" name="rating" value="5">☆☆☆☆☆</label>
                </div>

                <div>Date of Installation <span aria-hidden="true" style="color:red;">*</span></div>
                <input type="date" id="installationDate" name="installationDate" required>

                <div>Which features did you find useful in the product? <em>(Check all that apply)</em></div>
                
                <label><input type="checkbox" id="durability" name="features" value="yes">Durability</label>
                
                <label><input type="checkbox" id="easeOfUse" name="features" value="yes">Ease of Use</label>
                
                <label><input type="checkbox" id="performance" name="features" value="yes">Performance</label>
                
                <label><input type="checkbox" id="design" name="features" value="yes">Design</label>

                <div>Written Review<span style="color:rgb(42, 42, 42);">(Optional)</span></div>
                <textarea id="writtenReview" name="writtenReview" rows="4" cols="40"
                    placeholder="Write your review here..."></textarea>

                <label>Your Name <span style="color:rgb(42, 42, 42);">(Optional)</span>
                <input type="text" id="userName" name="userName"></label>
            </fieldset>

            <button type="submit">Post Review</button>
        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> Margarita Wendt | Germany</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
