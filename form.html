<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Rewiew</title>
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals Form page, Gilda Margarita Ortiz Reategui, Form Page.">
    <meta name="author" content="Gilda Margarita Ortiz Reategui">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src = "scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Rewiew</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="wf1">
            <fieldset>
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>
        
                <div>Overall Rating <span class="required">*</span></div>
                <div class="stairs">
                <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required>☆</label>
                
                <label for="rating2"><input type="radio" id="rating2" name="rating" value="2">☆☆</label>
                
                <label for="rating3"><input type="radio" id="rating3" name="rating" value="3">☆☆☆</label>
                
                <label for="rating4"><input type="radio" id="rating4" name="rating" value="4">☆☆☆☆</label>
                
                <label for="rating5"><input type="radio" id="rating5" name="rating" value="5">☆☆☆☆☆</label>
                </div>

                <label for="installationDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installationDate" name="installationDate" required>

                <div>Which features did you find useful in the product? <em>(Check all that apply)</em></div>
                
                <label for="durability"><input type="checkbox" id="durability" name="features" value="yes">Durability</label>
                
                <label for="easeOfUse"><input type="checkbox" id="easeOfUse" name="features" value="yes">Ease of Use</label>
                
                <label for="performance"><input type="checkbox" id="performance" name="features" value="yes">Performance</label>
                
                <label for="design"><input type="checkbox" id="design" name="features" value="yes">Design</label>

                <div>Written Review<span>(Optional)</span></div>
                <textarea id="writtenReview" name="writtenReview" 
                    placeholder="Write your review here..."></textarea>

                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">
            </fieldset>

            <button type="submit">Post Review</button>
        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> Margarita Wendt | Germany</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
